name: Auto-Build GitHub Pages & Standalone .EXE Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-releases'
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Web Page + Compile .EXE & Publish Release
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22 LTS (No lockfile required)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Dependencies & Build Static Web App
        run: |
          npm install --no-audit --no-fund
          npm run build
          cp dist/index.html dist/404.html

      - name: 4. Compile Standalone .EXE, macOS & Linux Binaries
        run: |
          node scripts/build-desktop-entry.cjs
          npx --yes @yao-pkg/pkg dist-bin/aethertunnel-desktop.cjs \
            --targets node18-win-x64,node18-macos-arm64,node18-linux-x64 \
            --output dist/downloads/AetherTunnel
          cp dist/index.html dist/downloads/AetherTunnel-Portable-Standalone.html
          cd dist/downloads
          sha256sum * > SHA256SUMS.txt

      - name: 5. Publish Direct-Download .EXE & Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AetherTunnel Standalone Release (Latest)"
          body: |
            ### AetherTunnel — Direct Downloadable Executables & Portable Web Build
            - **Windows Standalone Executable (`.exe`)**: `AetherTunnel-win-x64.exe` — Download and double-click to launch the graphical P2P tunnel (zero installation).
            - **macOS Apple Silicon Binary**: `AetherTunnel-macos-arm64`
            - **Linux x64 Binary**: `AetherTunnel-linux-x64`
            - **Single-File Portable HTML**: `AetherTunnel-Portable-Standalone.html`
          files: |
            dist/downloads/*
          prerelease: false
          make_latest: true

      - name: 6. Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-pages:
    name: Publish Live Web App to GitHub Pages
    needs: build-and-release
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable & Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
