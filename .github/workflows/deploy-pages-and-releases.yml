name: "Auto-Build GitHub Pages and Standalone EXE Release"

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-releases"
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: "Build Web Page and Compile EXE Release"
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: "1. Checkout Repository via Git"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

      - name: "2. Install Dependencies and Build Static Web App"
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: "3. Compile Native Windows EXE and Standalone Packages"
        run: |
          node scripts/build-desktop-entry.cjs
          ls -lh dist/downloads/

      - name: "4. Publish AetherTunnel-win-x64.exe to GitHub Releases"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          git tag -f "$TAG_NAME"
          git push origin "$TAG_NAME" --force
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/downloads/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" dist/downloads/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AetherTunnel Standalone Release (Latest)" \
              --notes "Direct-download standalone executables: AetherTunnel-win-x64.exe (Windows GUI), AetherTunnel-Portable-Standalone.html, macOS (.command), and Linux (.sh)." \
              --latest
          fi

      - name: "5. Configure GitHub Pages"
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: "6. Upload Artifact for GitHub Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: "7. Sync gh-pages Branch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy AetherTunnel Web App and Standalone EXE"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

  deploy-pages:
    name: "Deploy Live Site to GitHub Pages"
    needs: build-and-publish
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
