name: Auto-Build GitHub Pages & Standalone .EXE Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-releases'
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build Web Page + Compile .EXE & Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Install Dependencies & Build Static Web App
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: 4. Bundle Server & Compile Standalone Executables (.exe, macOS, Linux)
        run: |
          mkdir -p dist-bin dist/downloads
          npx esbuild server.ts --bundle --platform=node --target=node18 --outfile=dist-bin/aethertunnel.cjs --external:vite
          npx --yes @yao-pkg/pkg dist-bin/aethertunnel.cjs \
            --targets node18-win-x64,node18-macos-arm64,node18-linux-x64 \
            --output dist/downloads/AetherTunnel
          cp dist/index.html dist/downloads/AetherTunnel-Portable-Standalone.html
          cd dist/downloads
          sha256sum * > SHA256SUMS.txt

      - name: 5. Configure & Upload GitHub Pages Artifact (Includes /downloads/*.exe)
        uses: actions/configure-pages@v5

      - name: 6. Package Pages Directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 7. Deploy Live Website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 8. Publish Direct-Download .EXE & Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-release' }}
          name: "AetherTunnel Standalone Release (${{ github.sha }})"
          body: |
            ### AetherTunnel — Automatic Standalone Executables & Web Build
            - **Windows Standalone Executable**: `AetherTunnel-win-x64.exe` (Zero-install, double-click to run)
            - **macOS Apple Silicon Binary**: `AetherTunnel-macos-arm64`
            - **Linux x64 Binary**: `AetherTunnel-linux-x64`
            - **Single-File Portable HTML**: `AetherTunnel-Portable-Standalone.html`
          files: |
            dist/downloads/*
          prerelease: false
          make_latest: true
